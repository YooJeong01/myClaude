name: Collect job postings from Gmail alerts

on:
  schedule:
    # 3시간마다: 00:00, 03:00, 06:00, ... UTC
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

concurrency:
  group: collect-email-postings
  cancel-in-progress: false

jobs:
  collect-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx --env-file=.env.local server/jobs/collect-email-postings.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_OWNER_USER_ID: ${{ secrets.SCRAPE_OWNER_USER_ID }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
